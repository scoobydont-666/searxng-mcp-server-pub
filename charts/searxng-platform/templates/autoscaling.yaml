{{- $root := . -}}
{{- $components := dict "searxng" .Values.searxng -}}
{{- if or .Values.mcp.enabled .Values.mcp.apiEnabled -}}{{- $_ := set $components "mcp" .Values.mcp -}}{{- end -}}
{{- if .Values.web.enabled -}}{{- $_ := set $components "web" .Values.web -}}{{- $_ := set $components "web-admission" .Values.web.admission -}}{{- end -}}
{{- range $name, $c := $components }}
{{- if $c.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "search.fullname" $root }}-{{ $name }}
  labels:
    {{- include "search.labels" $root | nindent 4 }}
    app.kubernetes.io/component: {{ $name }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "search.fullname" $root }}-{{ $name }}
  minReplicas: {{ $c.autoscaling.minReplicas }}
  maxReplicas: {{ $c.autoscaling.maxReplicas }}
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies: [{type: Percent, value: 25, periodSeconds: 60}]
    scaleUp:
      stabilizationWindowSeconds: 30
      policies: [{type: Percent, value: 50, periodSeconds: 60}]
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ $c.autoscaling.targetCPUUtilizationPercentage }}
{{- end }}
{{- if $c.pdb.enabled }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "search.fullname" $root }}-{{ $name }}
  labels:
    {{- include "search.labels" $root | nindent 4 }}
    app.kubernetes.io/component: {{ $name }}
spec:
  minAvailable: {{ $c.pdb.minAvailable }}
  selector:
    matchLabels:
      {{- include "search.selector" $root | nindent 6 }}
      app.kubernetes.io/component: {{ $name }}
{{- end }}
{{- end }}
