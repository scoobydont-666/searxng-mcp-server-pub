{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "search.fullname" . }}
  labels:
    {{- include "search.labels" . | nindent 4 }}
  annotations:
    {{- if eq .Values.ingress.className "traefik" }}
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    {{- end }}
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className | quote }}
  tls:
    - secretName: {{ .Values.ingress.tlsSecretName }}
      hosts:
        {{- if or .Values.mcp.enabled .Values.mcp.apiEnabled }}
        - {{ .Values.ingress.apiHost | quote }}
        {{- end }}
        {{- if .Values.web.enabled }}
        - {{ .Values.ingress.webHost | quote }}
        {{- end }}
  rules:
    {{- if or .Values.mcp.enabled .Values.mcp.apiEnabled }}
    - host: {{ .Values.ingress.apiHost | quote }}
      http:
        paths:
          {{- if .Values.mcp.enabled }}
          - path: /mcp
            pathType: Exact
            backend:
              service:
                name: {{ include "search.fullname" . }}-mcp
                port: {name: http}
          {{- end }}
          {{- if .Values.mcp.apiEnabled }}
          - path: /api/v1/search
            pathType: Exact
            backend:
              service:
                name: {{ include "search.fullname" . }}-mcp
                port: {name: http}
          {{- end }}
    {{- end }}
    {{- if .Values.web.enabled }}
    - host: {{ .Values.ingress.webHost | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "search.fullname" . }}-web-auth
                port: {name: http}
    {{- end }}
{{- end }}
