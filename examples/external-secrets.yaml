# OPTIONAL prerequisite template, outside the Helm/Flux delivery unit.
# Requires an installed External Secrets Operator supporting external-secrets.io/v1
# and an operator-configured namespace-scoped SecretStore. It is not installed here.
# Copy to external-secrets.local.yaml; fill EVERY empty remote key/store name before use.
# Remote values are complete secret strings/documents, not credentials in this file.
# Choose one writer per destination Secret; do not combine ESO with a second reconciler.
# References: https://external-secrets.io/latest/api/externalsecret/
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: searxng-platform-secrets
  namespace: searxng
  annotations:
    searxng.platform/secret-revision: "1"
spec:
  # Rotate deliberately: update the remote reference/version and this metadata,
  # wait for Ready, then advance the chart's secrets.revision to restart consumers.
  refreshPolicy: OnChange
  secretStoreRef:
    name: ""
    kind: SecretStore
  target:
    name: searxng-platform-secrets
    creationPolicy: Orphan
    deletionPolicy: Retain
    template:
      type: Opaque
  data:
    - secretKey: principals.json
      remoteRef:
        key: "" # Complete principal digest manifest, produced by create_principal.py.
    - secretKey: searxng-secret
      remoteRef:
        key: "" # Strong independent native signing secret.
    - secretKey: valkey-url
      remoteRef:
        key: "" # Authenticated rediss:// URL used by BOTH Node gateways.
    - secretKey: searxng-valkey-url
      remoteRef:
        key: "" # Authenticated valkeys:// URL for the native HTML backend.
    - secretKey: session-valkey-url
      remoteRef:
        key: "" # Authenticated rediss:// URL for OAuth2 Proxy sessions.
  # For bundled lab Valkey, add a valkey-password entry and use matching private
  # redis:// / valkey:// URLs. For browser-disabled sites remove the last two entries.
  # Add remoteRef.version when the chosen provider supports immutable secret versions.
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: searxng-web-oidc
  namespace: searxng
  annotations:
    searxng.platform/secret-revision: "1"
spec:
  refreshPolicy: OnChange
  secretStoreRef:
    name: ""
    kind: SecretStore
  target:
    name: searxng-web-oidc
    creationPolicy: Orphan
    deletionPolicy: Retain
    template:
      type: Opaque
  data:
    - secretKey: client-secret
      remoteRef:
        key: "" # OIDC client secret provisioned by the identity provider.
    - secretKey: cookie-secret
      remoteRef:
        key: "" # Base64-encoded 32 random bytes; independent of all other secrets.
