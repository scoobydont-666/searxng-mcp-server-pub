  feedPolicy:
    version: 1
    maxAlternatives: 2
    triggerStatuses:
    - 403
    - 429
    - 503
    rules:
    - id: arxiv-official-api
      sourceHost: arxiv.org
      sourcePath: /abs/{paper}
      alternatives:
      - name: arXiv export API
        kind: atom
        urlTemplate: https://export.arxiv.org/api/query?id_list={paper}
    - id: github-official-releases
      sourceHost: github.com
      sourcePath: /{owner}/{repo}/releases
      alternatives:
      - name: GitHub releases Atom feed
        kind: atom
        urlTemplate: https://github.com/{owner}/{repo}/releases.atom
    - id: stackoverflow-official-api
      sourceHost: stackoverflow.com
      sourcePath: /questions/{question}/**
      alternatives:
      - name: Stack Exchange question API
        kind: api
        urlTemplate: https://api.stackexchange.com/2.3/questions/{question}?site=stackoverflow&filter=withbody
  fetch:
    userAgent: SearXNG-Platform/0.2 (+https://search.example.invalid/about)
    maxBytes: 8388608
    timeoutMs: 15000
    perHostConcurrency: 4
    globalRate: 10
    retries: 1
